{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="container">
        <h1 class="text-capitalize">admin approval portal</h1>
        <hr>
        <form method="post">
            {% csrf_token %}
            <fieldset class="form-group">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th scope="col">Event Name</th>
                            <th scope="col">Approve</th>
                        </tr>
                        </thead>
                        <tbody>
                        {% for event in events %}
                            <tr>
                                <td>{{ event.name }}</td>
                                <td>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="{{ event.id }}"
                                               id="{{ event.id }}" name="approve_status"
                                                {% if event.approved %}
                                               checked
                                                {% endif %}
                                        >
                                        <label class="form-check-label" for="{{ event.id }}">
                                            Approve
                                        </label>
                                    </div>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </fieldset>
            <div class="form-group pb-3">
                <button type="submit" class="btn btn-success text-capitalize">approve</button>
            </div>
        </form>
    </div>
{% endblock %}
