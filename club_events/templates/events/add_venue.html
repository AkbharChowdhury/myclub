{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="container">
        <form method="post" novalidate enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4 text-capitalize">Add Venue</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group pb-3">
                <button type="submit" class="btn btn-outline-info text-capitalize">Add Venue</button>
            </div>
        </form>
    </div>
{% endblock %}
