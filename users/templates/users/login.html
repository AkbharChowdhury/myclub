{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

    <div class="container">
        <form method="post" novalidate>
            {% csrf_token %}

            <fieldset class="form-group">
                <legend class="border-bottom mb-4 text-capitalize">Sign in</legend>
                {{ form|crispy }}
            </fieldset>

            <div class="form-group pb-3">
                <button type="submit" class="btn btn-success text-capitalize">Log in</button>
            </div>
        </form>
    </div>
{% endblock %}
